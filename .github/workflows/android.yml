name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Verify bundled art provenance
        run: python scripts/verify_assets.py
      - name: Test engine and build Android apps
        run: gradle :engine:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Package Android installer and corresponding source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/wesnoth-android-0.2.0.apk
          git archive --format=tar.gz --prefix=wesnoth-android-0.2.0/ HEAD > dist/wesnoth-android-0.2.0-source.tar.gz
          cd dist
          sha256sum wesnoth-android-0.2.0.apk wesnoth-android-0.2.0-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wesnoth-android-0.2.0
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/lint-results-debug.html
  ui-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: wesnoth-android-0.2.0
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-apk
          path: test-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the actual APK in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 1536M
          disk-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          disable-animations: true
          script: bash scripts/ui_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-screenshots
          path: |
            screenshots/
            instrumentation.log
          if-no-files-found: warn
  publish-prototype:
    needs: [build, ui-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prototype-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wesnoth-android-0.2.0
          path: dist
      - name: Publish tested Android prototype
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v0.2.0-prototype >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.2.0-prototype dist/* \
            --target "$SOURCE_COMMIT" \
            --title "Wesnoth Android 0.2.0 — Frontiers" \
            --prerelease \
            --notes-file docs/RELEASE-0.2.0.md
